name: Keep Render Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free tier from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health
        run: |
          echo "Pinging backend..."
          curl -fsS --max-time 120 https://event-management-system-g2p1.onrender.com/api/health || echo "Backend waking up..."
          echo "Done!"
